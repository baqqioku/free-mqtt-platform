# ============================================
# MQTT Server - Docker 鐜閰嶇疆
# ============================================

server.port=23240

# MQTT 绔彛
tcpPort=23242
tcpSslPort=23243

# ZooKeeper锛堜娇鐢ㄥ鍣ㄦ湇鍔″悕锛?
zk.address=zookeeper
clusterName=free-mqtt-cluster

# Redis锛堜娇鐢ㄥ鍣ㄦ湇鍔″悕锛?
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=123
spring.redis.pool.max-active=100
spring.redis.pool.max-idle=100
spring.redis.pool.max-wait=1000
spring.redis.pool.min-idle=10

# 鏃ュ織绾у埆
logging.level.root=INFO
logging.level.com.free=DEBUG

# SSL (TCP over TLS)
mqtt.ssl.enabled=false
mqtt.ssl.keystore.path=
mqtt.ssl.keystore.password=
mqtt.ssl.keystore.type=JKS
mqtt.ssl.needClientAuth=false

# ACL
mqtt.acl.enabled=false
mqtt.acl.file=
mqtt.acl.defaultAllow=true
mqtt.acl.reloadSeconds=30

# Will delay (seconds)
mqtt.will.delaySeconds=0

# Cluster
cluster.enabled=true
cluster.local.brokerName=broker-local
