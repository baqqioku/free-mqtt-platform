# ACL rules. First match wins.
# Format:
# allow|deny  user|client|all  <name or *>  pub|sub|pubsub  <topic-filter>

# Allow any client to subscribe to broker push topic
allow all pubsub /broker/to/client/#

# Example deny rule (enable in tests)
deny all pub /deny/#

# Default allow is controlled by mqtt.acl.defaultAllow
