# ============================================
# MQTT Route - Docker 鐜閰嶇疆
# ============================================

server.port=8084

# ZooKeeper锛堜娇鐢ㄥ鍣ㄦ湇鍔″悕锛?
zk.address=zookeeper
clusterName=free-mqtt-cluster

# Redis锛堜娇鐢ㄥ鍣ㄦ湇鍔″悕锛?
spring.redis.host=redis
spring.redis.port=6379
spring.redis.password=123
spring.redis.pool.max-active=100
spring.redis.pool.max-idle=100
spring.redis.pool.max-wait=1000
spring.redis.pool.min-idle=10

# 鏃ュ織绾у埆
logging.level.root=INFO
logging.level.com.free=DEBUG

# Cluster
cluster.enabled=true

# Static broker (when cluster.enabled=false)
route.static.enabled=false
route.static.brokerName=broker-local
route.static.host=127.0.0.1
route.static.tcpPort=1883
route.static.httpPort=23240
